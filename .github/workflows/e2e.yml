name: E2E

# E2E runs on push to main only — NOT on pull_request.
#
# Why: PR feedback loop must stay under ~3 minutes. Tests + Build run on PRs
# and gate merge via the branch-protection ruleset. E2E is the safety net
# for what actually shipped to main; if it fails, Vercel "Promote previous
# deployment" rolls back in <60 seconds (see docs/internal/runbook.md).
#
# Cost trade-off: a regression in main can briefly reach production before
# the post-merge E2E finishes. Acceptable because:
#   - main is solo-author for now; the merge cadence is low
#   - rollback is one click in the Vercel dashboard
#   - the alternative (waiting 5-10 minutes per PR for E2E) hurts every
#     iteration and discourages small commits
#
# BUT: a post-merge-only net must be LOUD when it tears. This workflow
# was red on every main push for ~2 months (stale skipOnboarding
# fixture) and nothing surfaced it — see the 2026-08-01 SDLC retro.
# The `notify-red` job below files/updates a tracking issue on failure
# so silent rust is structurally impossible.
on:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E (chromium) — shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Don't kill remaining shards if one fails — we want to see all failures
      # in a single CI cycle, not chase them shard-by-shard.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache the browser binary by Playwright version. Reduces a ~30-60s
      # download on every run to a ~2s restore. Cache key bumps automatically
      # when Playwright is upgraded.
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser + system deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # OS-level deps are not in the browser cache, so install them even on
      # cache hits. `install-deps` is fast (~10s) and idempotent.
      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Both projects (desktop + mobile). This was desktop-only with
      # "re-enable mobile if a regression class emerges" — the 2026-08
      # mobile-UX rounds were exactly that class (gesture and layout
      # regressions only visible in the mobile viewport).
      - name: Run E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/6 --max-failures=5

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # A post-merge safety net that fails silently is worse than none:
  # it reads as coverage while providing zero. Keep the red loud.
  notify-red:
    name: File tracking issue on E2E failure
    runs-on: ubuntu-latest
    needs: e2e
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open or bump the e2e-red tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh label create e2e-red --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "Post-merge E2E is red on main" \
            --force
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label e2e-red --state open --json number --jq '.[0].number // empty')
          body="Post-merge E2E failed on \`$SHA\`: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            printf -v full_body '%s\n\n%s' "$body" \
              "The post-merge E2E net has torn. Fix or revert before the next merge — a red net provides zero protection while reading as coverage (2026-08-01 SDLC retro)."
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "E2E red on main" \
              --label e2e-red \
              --body "$full_body"
          fi
