name: Release feedzero
# Triggered by the local /release skill via `gh workflow run` AFTER the
# landing changelog feed is confirmed live. Bumps the version, refreshes the
# vendored fixture from the live feed, verifies the version lock, runs the
# test suite, tags, and publishes the image via the reusable docker-publish
# workflow. See docs/operations/self-host-image-publishing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 0.12.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # Fail in seconds — before checkout/npm ci — if the two-repo ordering
  # invariant is violated: the landing changelog feed must already serve the
  # target version as its TOP entry (landing merges first; the app vendors
  # the feed). Encodes what was previously prose in the release runbook.
  # curl -L matters: feedzero.app 307-redirects to www.feedzero.app.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Landing feed serves ${{ inputs.version }} as the newest release
        run: |
          set -euo pipefail
          TOP="$(curl -fsSL https://feedzero.app/releases.xml \
            | grep -oE 'feedzero:release:[0-9.]+' | head -1 | cut -d: -f3)"
          if [ "$TOP" != "${{ inputs.version }}" ]; then
            echo "::error::Landing feed top entry is '$TOP', expected '${{ inputs.version }}'. Merge the landing release PR and wait for its deploy before running this workflow."
            exit 1
          fi
          echo "Feed top entry matches: $TOP"

  prepare:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Bump package.json
        run: npm version "${{ inputs.version }}" --no-git-tag-version
      - name: Refresh vendored fixture from the live landing feed
        run: curl -fsSL https://feedzero.app/releases.xml -o tests/fixtures/release-feed.xml
      - name: Verify version lock (package.json == feed top == input)
        run: |
          PKG="$(node -p "require('./package.json').version")"
          FEED="$(grep -oE 'feedzero:release:[0-9.]+' tests/fixtures/release-feed.xml | head -1 | cut -d: -f3)"
          test "$PKG" = "${{ inputs.version }}" || { echo "::error::package.json $PKG != input ${{ inputs.version }}"; exit 1; }
          test "$FEED" = "${{ inputs.version }}" || { echo "::error::landing feed top $FEED != ${{ inputs.version }} (publish landing first)"; exit 1; }
      - run: npx tsc --noEmit
      - run: npm test
      - name: Commit bump + fixture, then tag
        # HUSKY=0 disables the local dev hooks that `npm ci` installs via the
        # `prepare` script. Without it this step fails: the commit-msg hook
        # rejects `release:` (allowed types are feat|fix|chore|refactor|docs|
        # test|ci|build|perf|style|revert), so the bot's own commit message
        # trips a gate meant for humans. This workflow had never run, so the
        # blocker was latent — found while cutting 0.13.0.
        env:
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/fixtures/release-feed.xml
          git commit -m "release: v${{ inputs.version }}"
          git push origin main
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
  publish:
    needs: prepare
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
