# FeedZero — minimal self-host stack.
#
# Defaults are tuned for the common case: pull a pre-built image from
# the GitHub Container Registry, run behind Caddy with automatic TLS.
#
# Settings live in `.env` (copy `.env.example`). See docs/self-hosting.md
# for the full walkthrough.

services:
  feedzero:
    # Pre-built image. The same image is published to both GHCR and
    # Docker Hub on every release; swap the registry below if you'd
    # rather pull from Docker Hub (LAN-only Portainer users often
    # prefer that since it's the default registry in Portainer's UI):
    #
    #   image: docker.io/forcingfx/feedzero:${FEEDZERO_VERSION:-latest}
    #
    # To build locally instead (e.g. before the first release is
    # published, or when developing changes), run:
    #
    #   docker compose build
    #   docker compose up -d
    #
    # The `build:` section below tells compose how.
    image: ghcr.io/forcingfx/feedzero:${FEEDZERO_VERSION:-latest}
    build:
      context: .
      args:
        NODE_VERSION: 22-alpine
    container_name: feedzero
    restart: unless-stopped
    environment:
      SELF_HOSTED: "1"
      SYNC_STORAGE: filesystem
      # Inside the container the vault directory is always /data — the
      # Dockerfile creates it and gives it to the `node` user. This is the
      # variable resolveAdapter reads; it previously set SYNC_FILESYSTEM_DIR,
      # which nothing consumes, so sync fell back to a relative ./data under
      # /app and failed with EACCES (#224).
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      # NOTE: this ${DATA_DIR} is the HOST path (from your .env), unrelated
      # to the container-side DATA_DIR above. Host dir -> container /data.
      - ${DATA_DIR:-./data}:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: feedzero-caddy
    restart: unless-stopped
    environment:
      # Substituted into Caddyfile via `{$VAR}` syntax. `:?err` makes
      # compose refuse to start if HOSTNAME isn't set, so users get a
      # clear "you forgot to fill in .env" message instead of Caddy
      # silently trying to fetch a cert for `feedzero.example.com`.
      HOSTNAME: ${HOSTNAME:?Set HOSTNAME in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # `scripts/feedzero up` sets CADDYFILE to ./Caddyfile.lan when HOSTNAME
      # is an IP / localhost / .local (self-signed TLS); otherwise it stays
      # ./Caddyfile (Let's Encrypt). Both files must exist on the host — a
      # missing path makes Docker create a *directory* and Caddy fails to
      # start (issue #212). Portainer users: deploy via the Git Repository
      # stack method so these files are present.
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - feedzero

volumes:
  caddy-data:
  caddy-config:
